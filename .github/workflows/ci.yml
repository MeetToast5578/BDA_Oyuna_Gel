name: CI

on:
  push:
    branches: [main, Branch-1]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oyuna
          POSTGRES_PASSWORD: oyuna
          POSTGRES_DB: oyuna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oyuna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database for this run only; never a real one.
      DATABASE_URL: postgres://oyuna:oyuna@localhost:5432/oyuna
      PAYLOAD_SECRET: ci-only-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations apply to an empty database
        run: npx payload migrate
      - run: npx tsc --noEmit
      - run: npx eslint .
      - name: Tests (database suites included)
        run: npx vitest run
      - name: Production build
        run: npm run build
